[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glaiss"
version = "2.1.0"
description = "GlAIss llpc waitroom console: observability + manual model control (the waitroom is the only proxy)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["glaiss_app"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
# llpc/test_waitroom.py is a standalone aiohttp script suite for the shipped
# waitroom (run: `python3 llpc/test_waitroom.py`), not a pytest module.
addopts = "--ignore=llpc/test_waitroom.py"
