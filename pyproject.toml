[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glaiss"
version = "2.0.0"
description = "GlAIss llpc waitroom observability, visualization, and manual model control"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "tiktoken>=0.7",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["glaiss_app"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
